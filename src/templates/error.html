{% extends "base.html" %}
{% block title %}Error — Thoughts Dashboard{% endblock %}

{% block content %}
<section class="error-page">
  <h2>Something went wrong</h2>
  {# auto-escaped by Jinja2 — XSS prevention (web_security.spec REQ-3) #}
  <p class="error-message">{{ message }}</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Dashboard</a>
</section>
{% endblock %}
